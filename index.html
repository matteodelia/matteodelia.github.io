<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Matteo Delia</title>
	<meta name="description" content="Matteo Delia is a director based in Milan. He works on the production of music videos for various successful artists, but also on the creation of branded content for major brands.">
	<meta property="og:locale" content="it_IT">
	<meta property="og:type" content="website">
	<meta property="og:title" content="Matteo Delia">
	<meta property="og:description" content="Matteo Delia is a director based in Milan. He works on the production of music videos for various successful artists, but also on the creation of branded content for major brands.">
	<meta property="og:image" content="https://matteodelia.com/yellow.png">
	<link rel="shortcut icon" href="yellow.png">
	<link rel="stylesheet" type="text/css" href="css/style.css" />
	<script type="text/javascript" src="js/jquery.min.js"></script>
	<script type="text/javascript" src="js/javascript.js"></script>
</head>

<body>
	<div class="cursor">
		<div class="player"></div>
		<div class="circle"></div>
	</div>

	<div class="loader">
		<video autoplay muted playsinline preload="auto" poster="img/loader-inizio.webp">
			<source src="img/loader.webm" type="video/webm">
			<source src="img/loader.mp4" type="video/mp4">
		</video>
	</div>

	<div class="header">
		<a class="header_title"> MATTEO DELIA </a>
		<div class="selection_line_base"></div>
		<div class="selection_line"></div>
		<ul>
			<li> <a class="music">
					<p> MUSIC </p>
				</a> </li>
			<li> <a class="documentary">
					<p> DOCUMENTARY </p>
				</a> </li>
			<li> <a class="adv">
					<p> BRAND </p>
				</a> </li>
			<li> <a class="narrative">
					<p> NARRATIVE </p>
				</a> </li>
		</ul>

		<div class="contacts_container_image">
			<img src="img/contacts/instagram.png" alt="Instagram" class="instagram">
			<img src="img/contacts/vimeo.png" alt="Vimeo" class="vimeo">
		</div>
		<div class="contacts_container">
			<a href="https://www.instagram.com/98matteodelia/" target="_blank" class="instagram_hover"></a>
			<a href="https://vimeo.com/matteodelia" target="_blank" class="vimeo_hover"></a>
			<a href="mailto:matteodelia1998@gmail.com" target="_blank">
				<img src="img/contacts/mail.png" alt="Mail" class="mail">
			</a>
		</div>

	</div>

	<iframe src="https://player.vimeo.com/video/1065696659" width="50" frameborder="0" allowfullscreen allow="autoplay; encrypted-media" class="vimeo_link"></iframe>

	<script src="https://player.vimeo.com/api/player.js"></script>
	<script>
		const iframe = document.querySelector('iframe');
		const player = new Vimeo.Player(iframe);
	</script>

	<div id="page">
		<p id="current_page">1</p>
		<div id="fraction_page"></div>
		<p id="total_page">8</p>
	</div>

	<p id="expand">CLICK TO EXPAND</p>

	<div id="video_container"></div>

	<div id="scrollify_section"></div>

	<div class="credits_line"></div>
	<p class="credits">Credits</p>

	<div class="hover_credits"></div>

	<div class="exit_credits"></div>

</body>

</html>
